name: probe
on: { push: { branches: [claude/project-thread-9h3k51] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          curl -sL 'https://sites.google.com/view/suvasillevski/%D1%81%D0%B5%D0%BA%D1%86%D0%B8%D1%8F-%D0%B0%D0%BA%D1%82%D1%83%D0%B0%D0%BB%D0%BD%D0%BE' -o page.html
          python3 - <<'PY'
          import re
          h=open('page.html',encoding='utf-8').read()
          for m in list(re.finditer(r'sitesv-images-rt', h))[:4]:
              print('CTX', repr(h[m.start()-300:m.start()+400]))
          srcs=re.findall(r'<img[^>]+src="(https://sites\.google\.com/sitesv-images-rt/[^"]+)"', h)
          print('img-src', len(srcs), len(set(srcs)))
          print('data-src', len(re.findall(r'data-src="https://sites\.google\.com/sitesv-images-rt', h)))
          print('first', srcs[:1])
          open('u.txt','w').write(srcs[0] if srcs else '')
          PY
          u=$(cat u.txt | sed 's/&amp;/\&/g'); curl -s -o /dev/null -w 'fresh %{http_code} %{content_type} %{size_download}\n' "$u"
          curl -s -o /dev/null -w 'fresh1600 %{http_code} %{content_type} %{size_download}\n' "${u%=*}=w1600"
