name: probe
on: { push: { branches: [claude/project-thread-9h3k51] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -o /dev/null -w 'sitesref %{http_code} %{size_download}\n' -H 'Referer: https://sites.google.com/' '**Бележки:** Датите на новините са взети от самия им текст — сайтът не пази дата на публикуване. Където в текста има само ден и месец, годината е изведена от учебната година и това е отбелязано. Снимките в Google Sites са на адреси на Google (sites.google.com/sitesv-images-rt/…, lh3.googleusercontent.com/…); те работят, докато сайтът съществува, затова трябва да се свалят преди сайтът да бъде изтрит. Връзките в текста са запазени като Markdown връзки; пренасочванията на Google (google.com/url?q=…) са заменени с истинския адрес.'
          curl -sL 'https://sites.google.com/view/suvasillevski/%D1%81%D0%B5%D0%BA%D1%86%D0%B8%D1%8F-%D0%B0%D0%BA%D1%82%D1%83%D0%B0%D0%BB%D0%BD%D0%BE' -o page.html -w 'page %{http_code} %{size_download}\n'
          grep -oE 'https://sites\.google\.com/sitesv-images-rt/[^"&\\ ]+' page.html | sort -u > imgs.txt; wc -l imgs.txt
          grep -oE 'https://lh[0-9]\.googleusercontent\.com/[^"&\\ ]+' page.html | sort -u | wc -l
          head -2 imgs.txt | cut -c1-80
          u=$(head -1 imgs.txt); curl -s -o /dev/null -w 'fresh %{http_code} %{content_type} %{size_download}\n' "$u"
          grep -c 'AMxu72sD21VP6A3RVlc5n8bbrb8o' page.html || true
