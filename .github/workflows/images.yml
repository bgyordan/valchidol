# Еднократно: сваля снимките от стария Google сайт в R2 и сменя адресите им в базата.
# Actions → Old site images → Run workflow. С „dry“ само проверява колко снимки съвпадат.
name: Old site images

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry = само проверка, run = сваляне и смяна в базата, logo = логото от стария сайт, photos = размери на избраните снимки'
        type: choice
        options: [dry, run, logo, photos]
        default: dry

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Сваляне и качване в R2
        if: inputs.mode == 'dry' || inputs.mode == 'run'
        run: python3 -I scripts/migrate-images.py ${{ inputs.mode }}
      - name: Проверки (лого, размери на снимки)
        if: inputs.mode == 'logo' || inputs.mode == 'photos'
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="souvalchidol") | .uuid')
          sed -i "s/PLACEHOLDER-SET-AFTER-d1-create/$id/" wrangler.jsonc
          python3 -I scripts/site-check.py ${{ inputs.mode }}
      - name: Смяна на адресите в базата
        if: inputs.mode == 'run'
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="souvalchidol") | .uuid')
          sed -i "s/PLACEHOLDER-SET-AFTER-d1-create/$id/" wrangler.jsonc
          wc -l out/images.sql
          npx wrangler d1 execute souvalchidol --remote --file out/images.sql
