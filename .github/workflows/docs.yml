# Еднократно: връзките към файлове от текста на страниците → списък „Документи“ (по години и групи).
# Actions → Page documents → Run workflow. С „dry“ само показва какво ще се промени.
# Преди промяната текстовете на страниците се пазят като файл към пускането (pages-backup).
name: Page documents

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry = само проверка, run = промяна в базата'
        type: choice
        options: [dry, run]
        default: dry

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Текстовете на страниците от базата
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="souvalchidol") | .uuid')
          sed -i "s/PLACEHOLDER-SET-AFTER-d1-create/$id/" wrangler.jsonc
          mkdir -p out
          npx wrangler d1 execute souvalchidol --remote --json --command "SELECT slug, body FROM site_pages" > out/pages.json
          npx wrangler d1 execute souvalchidol --remote --json --command "SELECT * FROM site_documents" > out/documents-before.json
      - uses: actions/upload-artifact@v4
        with:
          name: pages-backup
          path: out/*.json
      - name: Разделяне
        run: python3 -I scripts/extract-docs.py out/pages.json ${{ inputs.mode }}
      - name: Запис в базата
        if: inputs.mode == 'run'
        run: npx wrangler d1 execute souvalchidol --remote --file out/docs.sql
